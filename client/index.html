<!DOCTYPE html>
<html lang="jp">
	<head>
		<meta charset="UTF-8" />
		<!-- Favicon: use PNG Micrie-logo-MAX.png (fix typo) -->
		<link rel="icon" type="image/png" href="/Micrie-logo-MAX.png" sizes="any" />
		<link rel="shortcut icon" href="/Micrie-logo-MAX.png" />
		<link rel="apple-touch-icon" href="/Micrie-logo-MAX.png" />
		<script>
			(function (d) {
				var config = {
						kitId: 'mud0ucd',
						scriptTimeout: 3000,
						async: true,
					},
					h = d.documentElement,
					t = setTimeout(function () {
						h.className = h.className.replace(/\bwf-loading\b/g, '') + ' wf-inactive';
					}, config.scriptTimeout),
					tk = d.createElement('script'),
					f = false,
					s = d.getElementsByTagName('script')[0],
					a;
				h.className += ' wf-loading';
				tk.src = 'https://use.typekit.net/' + config.kitId + '.js';
				tk.async = true;
				tk.onload = tk.onreadystatechange = function () {
					a = this.readyState;
					if (f || (a && a != 'complete' && a != 'loaded')) return;
					f = true;
					clearTimeout(t);
					try {
						Typekit.load(config);
					} catch (e) {}
				};
				s.parentNode.insertBefore(tk, s);
			})(document);
		</script>
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Micrie</title>
		<script src="https://surikov.github.io/webaudiofontdata/sound/0000_Aspirin_sf2_file.js"></script>
		<script src="https://surikov.github.io/webaudiofont/npm/dist/WebAudioFontPlayer.js"></script>
	</head>

	<body>
		<div id="root"></div>
		<script type="module" src="/src/app/index.tsx"></script>
	</body>
</html>
